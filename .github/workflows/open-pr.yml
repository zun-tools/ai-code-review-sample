name: open-pr
# エージェントが PR を開く代わり。GitHub Actions のボットが PR を開き、自動マージを予約する
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      title:
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR を開いて、自動マージを予約する
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
        run: |
          url=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "条件がそろえば、自動でマージされます。")
          echo "$url"
          gh pr merge "$url" --auto --squash
